<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000">
<link rel="manifest" href="manifest.json">
<title>Peaks AR</title>
<style>
  :root{--fg:#fff;--accent:#ffd166;--bg:rgba(0,0,0,.55)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;color:var(--fg);font:14px/1.3 -apple-system,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
  #cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
  #ar{position:fixed;inset:0;pointer-events:none}
  .pk{position:absolute;transform:translate(-50%,-100%);text-align:center;white-space:nowrap;will-change:left,top}
  .pk .l{display:inline-block;background:var(--bg);backdrop-filter:blur(4px);padding:3px 7px;border-radius:6px;font-weight:600;font-size:13px}
  .pk .l small{display:block;font-weight:400;font-size:11px;opacity:.85}
  .pk .t{width:1px;height:26px;background:var(--accent);margin:0 auto}
  .pk .d{width:7px;height:7px;border-radius:50%;background:var(--accent);margin:0 auto}
  .pk.far .l{font-size:11px;opacity:.8}.pk.far .t{height:14px}
  #compass{position:fixed;top:0;left:0;right:0;height:44px;padding-top:env(safe-area-inset-top);background:linear-gradient(#000a,#0000);overflow:hidden;pointer-events:none}
  #ticks{position:absolute;bottom:6px;left:50%;height:22px;white-space:nowrap;will-change:transform}
  #ticks span{position:absolute;bottom:0;transform:translateX(-50%);font-size:11px;font-weight:600;opacity:.9}
  #ticks i{position:absolute;bottom:0;width:1px;height:6px;background:#fff8}
  #compass:after{content:"";position:absolute;left:50%;bottom:0;width:2px;height:30px;background:var(--accent);transform:translateX(-50%)}
  #hud{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(#0000,#000c);display:flex;justify-content:space-between;align-items:flex-end;font-size:12px;gap:8px}
  #hud b{font-size:15px;color:var(--accent)}
  #status{opacity:.85;max-width:60%;pointer-events:auto}
  #hint{position:fixed;left:0;right:0;top:calc(52px + env(safe-area-inset-top));text-align:center;font-size:12px;opacity:.8;pointer-events:none}
  button{font:inherit;color:#000;background:var(--accent);border:0;border-radius:8px;padding:8px 12px;font-weight:700}
  #gear{background:#0009;color:#fff;padding:8px 10px}
  #start{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;z-index:9}
  #start h1{font-size:28px}#start p{opacity:.7;max-width:320px}
  #start button{padding:14px 28px;font-size:17px}
  #settings{position:fixed;left:0;right:0;bottom:0;background:#111;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-radius:14px 14px 0 0;display:none;z-index:8}
  #settings.open{display:block}
  #settings label{display:flex;justify-content:space-between;margin:10px 0 4px;font-size:13px}
  #settings input[type=range]{width:100%}
  #settings .row{display:flex;gap:8px;margin-top:12px}
  #settings .row button{flex:1}
  #horizon{position:fixed;left:0;right:0;height:1px;background:#fff3;pointer-events:none}
</style>
</head>
<body>
<video id="cam" autoplay muted playsinline></video>
<div id="horizon"></div>
<div id="ar"></div>
<div id="hint">Drag sideways to align the compass</div>
<div id="compass"><div id="ticks"></div></div>
<div id="hud">
  <div id="status">…</div>
  <div style="text-align:right"><b id="hdg">—</b><br><span id="pos">no fix</span></div>
  <button id="gear" onclick="settings.classList.toggle('open')">⚙︎</button>
</div>
<div id="settings">
  <label>Camera field of view <span id="fovV"></span></label><input type="range" id="fov" min="30" max="90" step="1">
  <label>Compass correction <span id="offV"></span></label><input type="range" id="off" min="-90" max="90" step="1">
  <label>Search radius <span id="radV"></span></label><input type="range" id="rad" min="5" max="50" step="5">
  <label>Min. peak height <span id="minV"></span></label><input type="range" id="min" min="0" max="3000" step="100">
  <div class="row"><button onclick="reloadPeaks()">Reload peaks</button><button style="background:#333;color:#fff" onclick="settings.classList.remove('open')">Close</button></div>
</div>
<div id="start">
  <h1>⛰ Peaks AR</h1>
  <p>Point your camera at the mountains to see peak names, heights and distances. Needs camera, location and motion access.</p>
  <button onclick="start()">Start</button>
  <p id="startErr" style="color:#f88"></p>
</div>

<script>
// ---- config (persisted) ----
const cfg = Object.assign({fov:35, off:0, rad:25, min:0}, JSON.parse(localStorage.cfg||'{}'));
// iPhone portrait: sensor 69° long side, cropped by object-fit:cover to ~35° across the screen. Calibrated against PeakVisor.
if (cfg.v !== 3) { cfg.fov = 35; cfg.v = 3; localStorage.cfg = JSON.stringify(cfg); }
const shows = {};
for (const k of ['fov','off','rad','min']) {
  const el = document.getElementById(k), v = document.getElementById(k+'V');
  el.value = cfg[k];
  const show = shows[k] = () => v.textContent = k==='off'?`${cfg[k]>0?'+':''}${cfg[k]}°` : k==='fov'?`${cfg[k]}°` : k==='rad'?`${cfg[k]} km` : `${cfg[k]} m`;
  show();
  el.oninput = () => { cfg[k] = +el.value; show(); localStorage.cfg = JSON.stringify(cfg); if (k==='rad'||k==='min') needFetch = true; };
}
function setOff(v) { cfg.off = Math.max(-90, Math.min(90, Math.round(v))); $('off').value = cfg.off; shows.off(); localStorage.cfg = JSON.stringify(cfg); }

// ---- state ----
const R = 6371000, D2R = Math.PI/180;
let me = null;          // {lat, lon, ele, dem}
let basis = null;       // camera axes in East/North/Up: {X:right, Y:up, F:forward}
let heading = null, yaw = 0, pitch = 0;
let peaks = [];         // [{id, name, lat, lon, ele, bearing, dist, elevAng, vis}]
let needFetch = true, fetchedAt = null, fetching = false;
const $ = id => document.getElementById(id);

// ---- start: permissions need a user gesture (iOS) ----
async function start() {
  watchGPS(); // synchronously inside the tap: some browsers only prompt for location from a user gesture
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
      if (await DeviceOrientationEvent.requestPermission() !== 'granted') throw new Error('Motion access denied');
    }
    $('cam').srcObject = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, width:{ideal:1920}}, audio:false});
  } catch (e) { $('startErr').textContent = e.message; return; }
  $('start').remove();
  // Android: absolute event has magnetometer-referenced alpha. iOS: plain event + webkitCompassHeading.
  window.addEventListener('deviceorientationabsolute', onOrient, true);
  window.addEventListener('deviceorientation', onOrient, true);
  requestAnimationFrame(render);
  setTimeout(() => $('hint').remove(), 8000);
}

function watchGPS() {
  navigator.geolocation.watchPosition(onPos, e => {
    if (e.code !== 1) { status('GPS: ' + e.message); return; }
    // Denied without a prompt = blocked at OS/browser level, or an in-app browser (Slack, Gmail, …) that never prompts.
    $('status').innerHTML = 'Location blocked. Open in Safari/Chrome itself (not an in-app browser).'
      + '<br>iOS: Settings › Privacy › Location Services › Safari Websites › While Using; Settings › Safari › Location › Ask.'
      + '<br>Android: lock icon › Permissions › Location › Allow. '
      + '<button onclick="watchGPS()" style="padding:4px 8px;margin-top:4px">Retry</button>';
  }, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
}

// ---- orientation → camera basis ----
let gotAbsolute = false;
function onOrient(e) {
  if (e.type === 'deviceorientationabsolute') gotAbsolute = true;
  else if (gotAbsolute) return; // prefer absolute stream on Android
  if (e.alpha == null) return;
  const a = e.alpha*D2R, b = e.beta*D2R, g = e.gamma*D2R;
  const ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(b), sb = Math.sin(b), cg = Math.cos(g), sg = Math.sin(g);
  // R = Rz(a)·Rx(b)·Ry(g); columns = device axes (X right, Y top, Z out of screen) in East/North/Up
  const X = [ca*cg - sa*sb*sg, sa*cg + ca*sb*sg, -cb*sg];
  const Y = [-sa*cb, ca*cb, sb];
  const F = [-(ca*sg + sa*sb*cg), -(sa*sg - ca*sb*cg), -(cb*cg)]; // back camera looks along -Z
  basis = {X, Y, F};
  pitch = Math.asin(Math.max(-1, Math.min(1, F[2]))) / D2R;
  const am = Math.atan2(F[0], F[1]) / D2R;                      // azimuth the matrix thinks the camera faces
  let h;
  if (e.webkitCompassHeading != null) h = e.webkitCompassHeading;  // iOS: alpha is not north-referenced, use compass
  else { h = am; if (!(e.absolute || e.type === 'deviceorientationabsolute')) status('Compass not absolute – heading unreliable'); }
  heading = ((h + cfg.off) % 360 + 360) % 360;
  yaw = ((heading - am + 540) % 360) - 180; // rotate the world by this before projecting through the matrix
}

// ---- drag sideways to align compass (PeakVisor-style manual mode) ----
let drag = null;
addEventListener('touchstart', e => { if (!e.target.closest('#hud,#settings,#start')) drag = {x:e.touches[0].clientX, off:cfg.off}; }, {passive:true});
addEventListener('touchmove', e => { if (drag) setOff(drag.off - (e.touches[0].clientX - drag.x) / (innerWidth/cfg.fov)); }, {passive:true});
addEventListener('touchend', () => drag = null);

// ---- position ----
async function onPos(p) {
  const {latitude:lat, longitude:lon, altitude:alt, accuracy} = p.coords;
  const first = !me;
  me = {lat, lon, ele: me?.ele ?? alt ?? 0, dem: me?.dem};
  $('pos').textContent = `${lat.toFixed(4)}, ${lon.toFixed(4)} · ±${Math.round(accuracy)}m`;
  if (first || needFetch || dist(me, fetchedAt||me) > 3000) {
    needFetch = false;
    groundElevation(lat, lon).then(e => { if (e != null) me.ele = e + 2; me.dem = true; recompute(); });
    loadPeaks(lat, lon);
  } else recompute();
}

// ---- DEM: AWS Terrarium tiles (free, no key, CORS). Decoded once per tile into metres. ----
const tiles = new Map();
const zoom = () => cfg.rad <= 12 ? 12 : cfg.rad <= 25 ? 11 : 10;   // ~26 / 52 / 105 m per pixel at 46°N
function tileXY(lat, lon, z) { const n = 2**z, φ = lat*D2R; return {x:(lon+180)/360*n, y:(1 - Math.log(Math.tan(φ) + 1/Math.cos(φ))/Math.PI)/2*n}; }
function loadTile(z, tx, ty) {
  const k = `${z}/${tx}/${ty}`;
  if (!tiles.has(k)) tiles.set(k, new Promise((res, rej) => {
    const img = new Image(); img.crossOrigin = 'anonymous';
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = 256;
      const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0);
      const d = ctx.getImageData(0, 0, 256, 256).data, e = new Float32Array(65536);
      for (let i = 0; i < 65536; i++) e[i] = d[i*4]*256 + d[i*4+1] + d[i*4+2]/256 - 32768;
      res(e);
    };
    img.onerror = () => { tiles.delete(k); rej(new Error('tile ' + k)); };
    img.src = `https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${k}.png`;
  }));
  return tiles.get(k);
}
async function elevAt(lat, lon, z = zoom()) {
  const {x, y} = tileXY(lat, lon, z), e = await loadTile(z, Math.floor(x), Math.floor(y));
  return e[Math.floor((y%1)*256)*256 + Math.floor((x%1)*256)];
}
// GPS altitude on phones is noisy/absent; use the DEM. Falls back to GPS alt.
async function groundElevation(lat, lon) { try { return await elevAt(lat, lon, 12); } catch { return null; } }

function reloadPeaks() { settings.classList.remove('open'); if (me) loadPeaks(me.lat, me.lon, true); }

async function loadPeaks(lat, lon, force) {
  if (fetching) return;
  const key = `peaks2:${lat.toFixed(2)},${lon.toFixed(2)},${cfg.rad}`;
  const cached = !force && localStorage.getItem(key);
  if (cached) { peaks = JSON.parse(cached); fetchedAt = {lat, lon}; recompute(); status(`${peaks.length} peaks (cached)`); return; }
  fetching = true; status('Loading peaks from OpenStreetMap…');
  const q = `[out:json][timeout:25];node["natural"="peak"]["name"]["ele"](around:${cfg.rad*1000},${lat},${lon});out body;`;
  const endpoints = ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
  for (const url of endpoints) {
    try {
      const r = await fetch(url, {method:'POST', body:'data='+encodeURIComponent(q)});
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      peaks = j.elements.map(n => ({id:n.id, name:n.tags.name, lat:n.lat, lon:n.lon, ele:parseFloat(String(n.tags.ele).replace(',','.'))})).filter(p => isFinite(p.ele));
      fetchedAt = {lat, lon};
      try { localStorage.setItem(key, JSON.stringify(peaks)); } catch {}
      recompute(); status(`${peaks.length} peaks within ${cfg.rad} km`);
      fetching = false; return;
    } catch (e) { console.warn(url, e); }
  }
  fetching = false; status('Peak download failed – check connection');
}

function dist(a, b) {
  const dLat = (b.lat-a.lat)*D2R, dLon = (b.lon-a.lon)*D2R;
  const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*D2R)*Math.cos(b.lat*D2R)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function bearing(a, b) {
  const φ1=a.lat*D2R, φ2=b.lat*D2R, dλ=(b.lon-a.lon)*D2R;
  const y=Math.sin(dλ)*Math.cos(φ2), x=Math.cos(φ1)*Math.sin(φ2)-Math.sin(φ1)*Math.cos(φ2)*Math.cos(dλ);
  return (Math.atan2(y,x)/D2R+360)%360;
}
// elevation angle of a point at height h, distance d, incl. earth curvature + standard refraction (k≈0.13)
const elevAngle = (h, d) => Math.atan2(h - me.ele - d*d/(2*R)*(1-0.13), d)/D2R;
function recompute() {
  if (!me) return;
  for (const p of peaks) { p.dist = dist(me, p); p.bearing = bearing(me, p); p.elevAng = elevAngle(p.ele, p.dist); }
  peaks.sort((a,b) => a.dist-b.dist);
  occlude();
}

// ---- terrain occlusion: walk the DEM along each sightline; hide peaks behind higher ground ----
let occAt = null, occBusy = false;
async function occlude() {
  if (!me?.dem || !peaks.length || occBusy) return;
  if (occAt && dist(me, occAt) >= 300) for (const p of peaks) p.vis = null;
  if (peaks.every(p => p.vis != null)) return;
  occBusy = true;
  const snap = peaks, at = occAt = {lat: me.lat, lon: me.lon};
  const z = zoom(), step = z === 12 ? 60 : z === 11 ? 100 : 150;
  status(`Checking ${snap.length} peaks against terrain…`);
  try {
    let n = 0;
    for (const p of snap) {
      if (snap !== peaks) break;
      if (p.vis != null) continue;
      let vis = true;
      for (let d = 200; d < p.dist - 200; d += step) {   // stop short of the summit: DEM smooths sharp tops
        const t = d/p.dist;
        if (elevAngle(await elevAt(at.lat + (p.lat-at.lat)*t, at.lon + (p.lon-at.lon)*t, z), d) > p.elevAng + 1.5) { vis = false; break; }   // 1.5°: DEM is ~30-50 m and smooths cliffs; false hides feel worse than extra labels
      }
      p.vis = vis;
      if (++n % 20 === 0) await new Promise(r => setTimeout(r));   // let the camera frame render
    }
    if (snap === peaks) status(`${snap.filter(p => p.vis).length} of ${snap.length} peaks visible from here`);
  } catch (e) {
    console.warn('occlusion', e); status('Terrain download failed – showing all peaks');
    for (const p of snap) if (p.vis == null) p.vis = true;
  }
  occBusy = false;
  if (snap !== peaks) occlude();
}

// ---- render ----
const ar = $('ar'), ticks = $('ticks'), hdgEl = $('hdg');
(function buildTicks(){ // 3 turns so we can scroll seamlessly
  const N = {0:'N',90:'E',180:'S',270:'W'}; let h = '';
  for (let d = -360; d < 720; d += 15) h += d%90===0 ? `<span data-d="${d}">${N[(d+360)%360]}</span>` : `<i data-d="${d}"></i>`;
  ticks.innerHTML = h;
})();
const labelCache = new Map();
const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];

function render() {
  requestAnimationFrame(render);
  if (!basis) return;
  const {X, Y, F} = basis;
  hdgEl.textContent = `${Math.round(heading)}° ${['N','NE','E','SE','S','SW','W','NW'][Math.round(heading/45)%8]}`;
  const W = innerWidth, H = innerHeight, f = (W/2)/Math.tan(cfg.fov/2*D2R), ppd = W/cfg.fov;
  for (const el of ticks.children) el.style.left = (( +el.dataset.d - heading) * ppd*0.6) + 'px';
  $('horizon').style.top = (H/2 + f*Math.tan(pitch*D2R)) + 'px';
  // pinhole projection of every visible peak through the device rotation matrix (handles pitch and roll)
  const cand = [];
  for (const p of peaks) {
    if (p.vis !== true || p.ele < cfg.min || p.dist < 150) continue;
    const b = (p.bearing - yaw)*D2R, e = p.elevAng*D2R, ce = Math.cos(e);
    const d = [Math.sin(b)*ce, Math.cos(b)*ce, Math.sin(e)];
    const pz = dot(d, F); if (pz < 0.3) continue;
    const x = W/2 + f*dot(d, X)/pz, y = H/2 - f*dot(d, Y)/pz;
    if (x < -60 || x > W+60 || y < -50 || y > H+50) continue;
    cand.push({p, x, y});
  }
  cand.sort((a, b) => b.p.elevAng - a.p.elevAng); // most prominent-looking first
  const seen = new Set(), placed = [];
  for (const {p, x, y} of cand) {
    const w = p.name.length*7.5 + 24, h = 68, r = {l:x-w/2, r:x+w/2, t:y-h, b:y};
    if (placed.some(q => r.l < q.r && r.r > q.l && r.t < q.b && r.b > q.t)) continue;
    placed.push(r);
    if (placed.length > 25) break;
    let el = labelCache.get(p);
    if (!el) {
      el = document.createElement('div'); el.className = 'pk';
      el.innerHTML = `<div class="l">${p.name}<small></small></div><div class="t"></div><div class="d"></div>`;
      labelCache.set(p, el);
    }
    if (!el.isConnected) ar.appendChild(el);
    el.classList.toggle('far', p.dist > 12000);
    el.querySelector('small').textContent = `${Math.round(p.ele)} m · ${(p.dist/1000).toFixed(1)} km`;
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.zIndex = 1000 - Math.round(p.dist/100);
    seen.add(p);
  }
  for (const [p, el] of labelCache) if (!seen.has(p) && el.isConnected) el.remove();
}
function status(t) { $('status').textContent = t; }
</script>
</body>
</html>
